[package]
name = "spaces-labels-app"
description = "A transparent, click-through label on every macOS Space"
edition.workspace = true
version.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
spaces-sys = { path = "../spaces_sys" }
tauri = { version = "2.12.0", features = ["tray-icon", "image-png", "macos-private-api"] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["std", "block2", "NSString", "NSNotification", "NSObject", "NSOperation"] }
objc2-app-kit = { workspace = true, features = ["std", "NSWindow", "NSResponder", "NSWorkspace", "NSGraphics"] }
